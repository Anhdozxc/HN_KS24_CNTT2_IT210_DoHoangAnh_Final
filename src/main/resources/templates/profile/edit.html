<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Ho so ca nhan</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>

<div class="container" style="max-width:500px;">
    <h1 style="margin-bottom:20px;">Ho so ca nhan</h1>

    <div class="alert alert-success" th:if="${param.success}">Luu thanh cong!</div>

    <!-- Hien anh dai dien hien tai -->
    <div th:if="${profile != null and profile.avatarUrl != null}"
         style="text-align:center;margin-bottom:20px;">
        <img th:src="${profile.avatarUrl}"
             style="width:100px;height:100px;border-radius:50%;object-fit:cover;border:3px solid #0066cc;"/>
    </div>

    <form method="post" action="/profile/save"
          enctype="multipart/form-data"
          th:object="${dto}"
          style="background:#fff;padding:24px;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.08);">

        <div class="form-group">
            <label>Ho va ten</label>
            <input type="text" th:field="*{fullName}"/>
        </div>
        <div class="form-group">
            <label>So dien thoai</label>
            <input type="text" th:field="*{phone}"/>
        </div>
        <div class="form-group">
            <label>Dia chi</label>
            <input type="text" th:field="*{address}"/>
        </div>
        <div class="form-group">
            <label>Anh dai dien</label>
            <input type="file" name="avatarFile" accept="image/*"/>
            <p style="font-size:0.8rem;color:#666;margin-top:4px;">De trong neu khong muon doi anh.</p>
        </div>

        <button type="submit" class="btn btn-primary">Luu thay doi</button>
    </form>
</div>

<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
