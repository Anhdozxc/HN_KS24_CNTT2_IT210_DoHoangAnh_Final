<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title th:text="${movie.title}">Chi tiết phim</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>

<div class="container">
    <!-- Thông tin phim -->
    <div class="panel-card detail-layout">
        <img th:if="${movie.posterUrl != null}"
             th:src="${movie.posterUrl}"
             style="width:180px;height:260px;object-fit:cover;border-radius:6px;flex-shrink:0;"/>
        <div>
            <h1 th:text="${movie.title}" style="margin-bottom:8px; color:#fff;"></h1>
            <p th:text="${'Thể loại: ' + (movie.genre != null ? movie.genre.name : 'Không rõ')}" style="color:#a0a0a0;margin-bottom:6px;"></p>
            <p th:text="${'Thời lượng: ' + movie.duration + ' phút'}" style="color:#a0a0a0;margin-bottom:12px;"></p>
            <p th:text="${movie.description}" style="line-height:1.6;color:#e0e0e0;"></p>
        </div>
    </div>

    <!-- Danh sách suất chiếu -->
    <h2 style="margin-bottom:14px; color:#fff;">Chọn suất chiếu</h2>

    <div th:if="${#lists.isEmpty(showtimes)}" style="color:#a0a0a0;">
        Hiện tại chưa có suất chiếu nào cho phim này.
    </div>

    <div class="showtime-list">
        <div class="showtime-item" th:each="s : ${showtimes}">
            <div style="font-weight:bold;margin-bottom:4px;color:#fff;" th:text="${s.room.name}"></div>
            <div style="margin-bottom:4px;color:#e0e0e0;" th:text="${#temporals.format(s.startTime, 'HH:mm - dd/MM/yyyy')}"></div>
            <div class="price" th:text="${#numbers.formatDecimal(s.price, 0, 'COMMA', 0, 'POINT') + ' VND'}"></div>

            <!-- Hết vé nếu đã sold out -->
            <span class="badge badge-soldout" th:if="${soldOutMap[s.id]}">Hết vé</span>
            <span class="badge badge-available" th:if="${!soldOutMap[s.id]}">Còn ghế</span>

            <!-- Chỉ hiển nút đặt vé nếu còn ghế và đã đăng nhập -->
            <a th:if="${!soldOutMap[s.id] and session.loggedUser != null and session.loggedUser.role.name() == 'CUSTOMER'}"
               th:href="@{/booking/seats/{id}(id=${s.id})}"
               class="btn btn-primary">Đặt vé</a>

            <!-- Chưa đăng nhập thì mời đăng nhập -->
            <a th:if="${session.loggedUser == null}"
               href="/auth/login"
               class="btn btn-secondary">Đăng nhập để đặt</a>
        </div>
    </div>
</div>

<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
