<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Lich su dat ve</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>

<div class="container">
    <h1 style="margin-bottom:16px;">Lich su dat ve cua ban</h1>

    <div class="alert alert-success" th:if="${param.success}">Da huy ve thanh cong!</div>
    <div class="alert alert-error" th:if="${param.error}" th:text="${param.error}"></div>

    <div th:if="${#lists.isEmpty(bookings)}" style="color:#aaa;text-align:center;margin-top:40px;">
        Ban chua dat ve lan nao.
    </div>

    <!-- Moi hoa don hien 1 card -->
    <div th:each="b : ${bookings}"
         style="background:#fff;border-radius:8px;padding:20px;margin-bottom:16px;box-shadow:0 2px 8px rgba(0,0,0,.08);">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;">
            <div>
                <div style="font-size:1.1rem;font-weight:bold;margin-bottom:6px;" th:text="${b.showtime.movie.title}"></div>
                <div style="color:#666;font-size:0.9rem;">
                    <span th:text="${b.showtime.room.name}"></span> |
                    <span th:text="${#temporals.format(b.showtime.startTime, 'HH:mm dd/MM/yyyy')}"></span>
                </div>
                <div style="color:#e94560;font-weight:bold;margin-top:6px;"
                     th:text="${#numbers.formatDecimal(b.totalPrice, 0, 'COMMA', 0, 'POINT') + ' VND'}"></div>
                <div style="font-size:0.82rem;color:#999;margin-top:4px;"
                     th:text="'Dat luc: ' + ${#temporals.format(b.bookedAt, 'HH:mm dd/MM/yyyy')}"></div>
            </div>
            <div style="text-align:right;">
                <!-- Badge trang thai -->
                <span class="badge badge-confirmed" th:if="${b.status.name() == 'CONFIRMED'}">Da xac nhan</span>
                <span class="badge badge-cancelled" th:if="${b.status.name() == 'CANCELLED'}">Da huy</span>
                <span class="badge badge-pending"   th:if="${b.status.name() == 'PENDING'}">Cho xu ly</span>

                <!-- CORE-09: Nut huy ve (chi hien khi CONFIRMED va chua chieu) -->
                <form th:if="${b.status.name() == 'CONFIRMED'}"
                      th:action="@{/booking/cancel/{id}(id=${b.id})}"
                      method="post" style="margin-top:8px;"
                      onsubmit="return confirm('Ban co chac chan muon huy ve nay?')">
                    <button type="submit" class="btn btn-danger" style="font-size:0.85rem;padding:4px 10px;">Huy ve</button>
                </form>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
