<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Trang chủ - Cinema Booking</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>


<!-- ===== MAIN CONTENT ===== -->
<div class="container">
    <!-- Thông báo lỗi (nếu có) -->
    <div class="alert alert-error" th:if="${param.error}">Bạn không có quyền truy cập trang này.</div>

    <!-- Tiêu đề section phim -->
    <h1 class="section-title" id="movie-list">Phim Đang Chiếu</h1>
    <p class="section-subtitle">Chọn bộ phim bạn muốn xem - Đặt vé nhanh chóng, dễ dàng</p>

    <!-- Lưới phim (Grid Layout) -->
    <div class="movie-grid">
        <div class="movie-card" th:each="movie : ${movies}">
            <!-- Hình ảnh poster phim -->
            <a th:href="@{/movie/{id}(id=${movie.id})}">
                <img th:if="${movie.posterUrl != null}"
                     th:src="${movie.posterUrl}"
                     th:alt="${movie.title}"
                     style="cursor: pointer;"/>
                <!-- Ảnh placeholder nếu chưa có poster -->
                <div th:if="${movie.posterUrl == null}"
                     style="width: 100%; height: 260px; background: linear-gradient(135deg, #404050, #505060); display: flex; align-items: center; justify-content: center; color: #a0a0a0;">
                    Không có ảnh
                </div>
            </a>

            <!-- Thông tin phim -->
            <div class="card-body">
                <div class="card-title" th:text="${movie.title}">Tên phim</div>
                <div class="card-genre" th:text="${movie.genre != null ? movie.genre.name : 'N/A'}">Thể loại</div>
                <div class="card-duration" th:text="${movie.duration + ' phút'}">120 phút</div>
            </div>

            <!-- Button xem suất chiếu -->
            <div class="card-footer">
                <a th:href="@{/movie/{id}(id=${movie.id})}">Xem suất chiếu</a>
            </div>
        </div>
    </div>

    <!-- Thông báo nếu không có phim -->
    <p th:if="${#lists.isEmpty(movies)}" style="color: #a0a0a0; text-align: center; margin-top: 40px;">
        Hiện tại chưa có phim nào đang chiếu. Vui lòng quay lại sau.
    </p>
</div>

<!-- ===== FOOTER ===== -->
<div th:replace="~{fragments/layout :: footer}"></div>


</body>
</html>
