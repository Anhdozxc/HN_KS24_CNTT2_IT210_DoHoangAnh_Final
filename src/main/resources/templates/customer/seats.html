<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Chọn ghế</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>

<div class="container">
    <h1 style="margin-bottom:4px;" th:text="${showtime.movie.title}"></h1>
    <p style="color:#666;margin-bottom:20px;"
       th:text="${showtime.room.name + ' | ' + #temporals.format(showtime.startTime, 'HH:mm dd/MM/yyyy') + ' | ' + #numbers.formatDecimal(showtime.price, 0, 'COMMA', 0, 'POINT') + ' VND/ghế'}">
    </p>

    <!-- Thông báo lỗi (ghế bị đặt mất) -->
    <div class="alert alert-error" th:if="${param.error}" th:text="${param.error}"></div>

    <!-- Chú thích màu ghế -->
    <div class="seat-legend">
        <div class="legend-item">
            <div class="legend-box" style="border:2px solid #0066cc;"></div> Còn trống
        </div>
        <div class="legend-item">
            <div class="legend-box" style="background:#0066cc;"></div> Đang chọn
        </div>
        <div class="legend-item">
            <div class="legend-box" style="background:#ccc;border:2px solid #999;"></div> Đã đặt
        </div>
    </div>

    <!-- Màn hình chiếu -->
    <div class="screen" style="margin-top:16px;">--- MÀN HÌNH ---</div>

    <!-- Sơ đồ ghế -->
    <div class="seat-grid" id="seatGrid">
        <!-- Nhóm ghế theo hàng (lấy ký tự đầu tên ghế: A1->A, B1->B...) -->
        <!-- Dùng Thymeleaf groupBy hoặc xử lý theo index -->
        <div th:each="seat : ${seats}" style="display:inline;">
            <!-- Đặt id là seat-{id} để JS xử lý -->
            <span th:id="'seat-' + ${seat.id}"
                  th:attr="data-id=${seat.id}, data-name=${seat.seatName}"
                  th:classappend="${bookedSeatIds.contains(seat.id)} ? ' booked' : ''"
                  class="seat"
                  th:text="${seat.seatName}"
                  onclick="toggleSeat(this)">
            </span>
        </div>
    </div>

    <!-- Form đặt vé -->
    <form method="post" action="/booking/create" id="bookingForm" style="margin-top:24px;">
        <input type="hidden" name="showtimeId" th:value="${showtime.id}"/>
        <!-- JS sẽ thêm input seatIds[] vào đây -->
        <div id="selectedSeatsInput"></div>

        <div class="booking-summary">
            <div>Ghế đã chọn: <strong id="selectedNames">Chưa chọn</strong></div>
            <div>Số lượng: <strong id="seatCount">0</strong> ghế</div>
            <div class="total" id="totalPrice">Tổng tiền: 0 VND</div>
        </div>

        <button type="submit" class="btn btn-primary" style="margin-top:16px;padding:10px 30px;"
                onclick="return validateSeats()">Xác nhận đặt vé</button>
        <a href="javascript:history.back()" class="btn btn-secondary" style="margin-left:10px;">Quay lại</a>
    </form>
</div>

<script th:inline="javascript">
    // Lấy giá vé từ Thymeleaf truyền sang JS
    const price = [[${showtime.price}]];
    let selected = [];  // Mảng chứa id ghế đang chọn

    // Bật/tắt chọn ghế
    function toggleSeat(el) {
        if (el.classList.contains('booked')) return;  // Ghế đã đặt, không cho chọn

        const id = el.dataset.id;
        const name = el.dataset.name;

        if (el.classList.contains('selected')) {
            // Bỏ chọn
            el.classList.remove('selected');
            selected = selected.filter(s => s.id !== id);
        } else {
            // Chọn ghế
            el.classList.add('selected');
            selected.push({ id, name });
        }
        updateSummary();
    }

    // Cập nhật tổng tiền và danh sách ghế chọn
    function updateSummary() {
        document.getElementById('seatCount').textContent = selected.length;
        document.getElementById('selectedNames').textContent =
            selected.length > 0 ? selected.map(s => s.name).join(', ') : 'Chưa chọn';

        const total = selected.length * price;
        document.getElementById('totalPrice').textContent =
            'Tổng tiền: ' + total.toLocaleString('vi-VN') + ' VND';

        // Xóa input cũ, thêm mới vào form
        const container = document.getElementById('selectedSeatsInput');
        container.innerHTML = '';
        selected.forEach(s => {
            const input = document.createElement('input');
            input.type = 'hidden';
            input.name = 'seatIds';
            input.value = s.id;
            container.appendChild(input);
        });
    }

    // Kiểm tra trước khi submit
    function validateSeats() {
        if (selected.length === 0) {
            alert('Vui lòng chọn ít nhất 1 ghế!');
            return false;
        }
        return true;
    }
</script>

<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
