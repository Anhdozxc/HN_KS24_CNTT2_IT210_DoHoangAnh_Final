<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Đăng nhập - Cinema</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div class="auth-page">
    <div class="form-card">
        <h2>Đăng nhập</h2>

        <div class="auth-message-slot">
            <div class="alert alert-error" th:if="${error}" th:text="${error}"></div>
            <div class="alert alert-success" th:if="${param.success}">Thao tác thành công!</div>
        </div>

        <form method="post" action="/auth/login" th:object="${dto}">
            <div class="form-group">
                <label>Tên đăng nhập</label>
                <input type="text" th:field="*{username}" placeholder="Nhập tên đăng nhập" autocomplete="username"/>
                <div class="field-error-slot">
                    <span class="error-msg" th:text="${#fields.hasErrors('username') ? #fields.errors('username')[0] : ' '}"></span>
                </div>
            </div>
            <div class="form-group">
                <label>Mật khẩu</label>
                <input type="password" th:field="*{password}" placeholder="Nhập mật khẩu" autocomplete="current-password"/>
                <div class="field-error-slot">
                    <span class="error-msg" th:text="${#fields.hasErrors('password') ? #fields.errors('password')[0] : ' '}"></span>
                </div>
            </div>
            <button type="submit" class="btn btn-primary" style="width:100%">Đăng nhập</button>
        </form>

        <p style="margin-top:14px;text-align:center;">
            Chưa có tài khoản? <a href="/auth/register">Đăng ký ngay</a>
        </p>
    </div>
</div>
</body>
</html>
