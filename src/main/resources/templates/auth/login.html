<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Dang nhap - Cinema</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div class="form-card">
    <h2>Dang nhap</h2>

    <!-- Thong bao loi -->
    <div class="alert alert-error" th:if="${error}" th:text="${error}"></div>
    <!-- Thong bao thanh cong (vd: sau dang ky) -->
    <div class="alert alert-success" th:if="${param.success}">Thao tac thanh cong!</div>

    <form method="post" action="/auth/login">
        <div class="form-group">
            <label>Ten dang nhap</label>
            <input type="text" name="username" required/>
        </div>
        <div class="form-group">
            <label>Mat khau</label>
            <input type="password" name="password" required/>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%">Dang nhap</button>
    </form>

    <p style="margin-top:14px;text-align:center;">
        Chua co tai khoan? <a href="/auth/register">Dang ky ngay</a>
    </p>
</div>
</body>
</html>
