<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Quản lý phim</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>

<div class="container">
    <div class="page-header">
        <h1>Danh sách phim</h1>
        <a href="/admin/movies/new" class="btn btn-primary">Thêm phim mới</a>
    </div>

    <div class="alert alert-success" th:if="${param.success}">Thao tác thành công!</div>

    <div class="table-wrap">
        <table>
            <thead>
            <tr>
                <th>#</th>
                <th>Poster</th>
                <th>Tên phim</th>
                <th>Thể loại</th>
                <th>Thời lượng</th>
                <th>Trạng thái</th>
                <th>Hành động</th>
            </tr>
            </thead>
            <tbody>
            <!-- Lặp danh sách phim -->
            <tr th:each="movie : ${movies}">
                <td th:text="${movie.id}"></td>
                <td>
                    <!-- Hiển thị poster nếu có -->
                    <img th:if="${movie.posterUrl != null}"
                         th:src="${movie.posterUrl}"
                         style="width:50px;height:70px;object-fit:cover;border-radius:3px;"/>
                    <span th:if="${movie.posterUrl == null}" style="color:#a0a0a0;">Không có ảnh</span>
                </td>
                <td th:text="${movie.title}"></td>
                <td th:text="${movie.genre != null ? movie.genre.name : '-'}"></td>
                <td th:text="${movie.duration + ' phút'}"></td>
                <td>
                    <span class="badge badge-confirmed" th:if="${movie.active}">Hiển thị</span>
                    <span class="badge badge-cancelled" th:if="${!movie.active}">Ẩn</span>
                </td>
                <td>
                    <a th:href="@{/admin/movies/edit/{id}(id=${movie.id})}" class="btn btn-secondary" style="padding:4px 10px;font-size:0.85rem;">Sửa</a>
                    <!-- Ẩn phim bằng POST -->
                    <form th:action="@{/admin/movies/delete/{id}(id=${movie.id})}"
                          method="post" style="display:inline;"
                          onsubmit="return confirm('Ẩn phim này khỏi danh sách?')">
                        <button type="submit" class="btn btn-danger" style="padding:4px 10px;font-size:0.85rem;">Ẩn</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(movies)}">
                <td colspan="7" style="text-align:center;color:#a0a0a0;">Chưa có phim nào</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
