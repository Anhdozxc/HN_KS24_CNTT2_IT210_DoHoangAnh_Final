<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Form Phim</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>

<div class="container">
    <div class="page-header">
        <!-- Nếu dto.id != null -> đang sửa, ngược lại -> đang tạo mới -->
        <h1 th:text="${dto.id != null ? 'Sửa phim' : 'Thêm phim mới'}">Form Phim</h1>
        <a href="/admin/movies" class="btn btn-secondary">Quay lại</a>
    </div>

    <div class="alert alert-error" th:if="${error}" th:text="${error}"></div>

    <!-- Form tối, dễ nhìn -->
    <form method="post" action="/admin/movies/save"
          enctype="multipart/form-data"
          th:object="${dto}"
          class="panel-card form-panel">

        <!-- Field ẩn: truyền id khi sửa -->
        <input type="hidden" th:field="*{id}"/>

        <div class="form-group">
            <label>Tên phim *</label>
            <input type="text" th:field="*{title}"/>
            <span class="error-msg" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></span>
        </div>

        <div class="form-group">
            <label>Mô tả</label>
            <textarea th:field="*{description}"></textarea>
        </div>

        <div class="form-group">
            <label>Thời lượng (phút) *</label>
            <input type="number" th:field="*{duration}" min="1"/>
            <span class="error-msg" th:if="${#fields.hasErrors('duration')}" th:errors="*{duration}"></span>
        </div>

        <div class="form-group">
            <label>Thể loại *</label>
            <select th:field="*{genreId}">
                <option value="">-- Chọn thể loại --</option>
                <!-- Lặp danh mục thể loại -->
                <option th:each="g : ${genres}"
                        th:value="${g.id}"
                        th:text="${g.name}"></option>
            </select>
            <span class="error-msg" th:if="${#fields.hasErrors('genreId')}" th:errors="*{genreId}"></span>
        </div>

        <div class="form-group">
            <label>Ngày phát hành</label>
            <input type="date" th:field="*{releaseDate}"/>
        </div>

        <div class="form-group">
            <label>Poster (ảnh phim)</label>
            <!-- Hiển thị ảnh cũ nếu đang sửa -->
            <div th:if="${movie != null and movie.posterUrl != null}" style="margin-bottom:8px;">
                <img th:src="${movie.posterUrl}" style="width:80px;height:110px;object-fit:cover;border-radius:4px;"/>
                <p style="font-size:0.8rem;color:#a0a0a0;margin-top:4px;">Ảnh hiện tại. Chọn ảnh mới để thay thế.</p>
            </div>
            <!-- name="posterFile" phải khớp với tên field trong MovieDTO -->
            <input type="file" name="posterFile" accept="image/*"/>
        </div>

        <button type="submit" class="btn btn-primary">Lưu</button>
    </form>
</div>

<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
