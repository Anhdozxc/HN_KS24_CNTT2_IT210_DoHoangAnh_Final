<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title th:text="${dto.id == null ? 'Thêm suất chiếu' : 'Sửa suất chiếu'}">Thêm suất chiếu</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>

<div class="container">
    <div class="page-header">
        <h1 th:text="${dto.id == null ? 'Tạo suất chiếu mới' : 'Cập nhật suất chiếu'}">Tạo suất chiếu mới</h1>
        <a href="/admin/showtimes" class="btn btn-secondary">Quay lại</a>
    </div>

    <!-- Hiển lỗi xung đột phòng -->
    <div class="alert alert-error" th:if="${error}" th:text="${error}"></div>

    <form method="post" action="/admin/showtimes/save"
          th:object="${dto}"
          style="background:#fff;padding:24px;border-radius:8px;max-width:500px;box-shadow:0 2px 8px rgba(0,0,0,.08);">

        <input type="hidden" th:field="*{id}"/>

        <div class="form-group">
            <label>Phim *</label>
            <select th:field="*{movieId}">
                <option value="">-- Chọn phim --</option>
                <option th:each="m : ${movies}"
                        th:value="${m.id}"
                        th:text="${m.title + ' (' + m.duration + ' phút)'}"></option>
            </select>
            <span class="error-msg" th:if="${#fields.hasErrors('movieId')}" th:errors="*{movieId}"></span>
        </div>

        <div class="form-group">
            <label>Phòng chiếu *</label>
            <select th:field="*{roomId}">
                <option value="">-- Chọn phòng --</option>
                <option th:each="r : ${rooms}"
                        th:value="${r.id}"
                        th:text="${r.name + ' (' + r.totalSeats + ' ghế)'}"></option>
            </select>
            <span class="error-msg" th:if="${#fields.hasErrors('roomId')}" th:errors="*{roomId}"></span>
        </div>

        <div class="form-group">
            <label>Giờ bắt đầu *</label>
            <!-- datetime-local: input chọn ngày giờ trên trình duyệt -->
            <input type="datetime-local" th:field="*{startTime}"/>
            <span class="error-msg" th:if="${#fields.hasErrors('startTime')}" th:errors="*{startTime}"></span>
        </div>

        <div class="form-group">
            <label>Giá vé (VND) *</label>
            <input type="number" th:field="*{price}" min="0" step="1000"/>
            <span class="error-msg" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></span>
        </div>

        <p style="font-size:0.85rem;color:#666;margin-bottom:14px;">
            Lưu ý: Giờ kết thúc = Giờ bắt đầu + Thời lượng phim + 15 phút dọn phòng.
            Hệ thống tự động kiểm tra xung đột phòng.
        </p>

        <button type="submit" class="btn btn-primary" th:text="${dto.id == null ? 'Tạo suất chiếu' : 'Lưu thay đổi'}">Tạo suất chiếu</button>
    </form>
</div>

<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
