<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Quản lý suất chiếu</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>

<div class="container">
    <div class="page-header">
        <h1>Danh sách suất chiếu</h1>
        <a href="/admin/showtimes/new" class="btn btn-primary">+ Thêm suất chiếu</a>
    </div>

    <div class="alert alert-success" th:if="${param.success}">Thao tác thành công!</div>

    <div class="table-wrap">
        <table>
            <thead>
            <tr>
                <th>#</th>
                <th>Phim</th>
                <th>Phòng</th>
                <th>Giờ bắt đầu</th>
                <th>Giờ kết thúc</th>
                <th>Giá vé</th>
                <th>Hành động</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="s : ${showtimes}">
                <td th:text="${s.id}"></td>
                <td th:text="${s.movie.title}"></td>
                <td th:text="${s.room.name}"></td>
                <!-- #temporals: format LocalDateTime trong Thymeleaf -->
                <td th:text="${#temporals.format(s.startTime, 'dd/MM/yyyy HH:mm')}"></td>
                <td th:text="${#temporals.format(s.endTime, 'dd/MM/yyyy HH:mm')}"></td>
                <td th:text="${#numbers.formatDecimal(s.price, 0, 'COMMA', 0, 'POINT') + ' VND'}"></td>
                <td>
                    <form th:action="@{/admin/showtimes/delete/{id}(id=${s.id})}"
                          method="post" style="display:inline;"
                          onsubmit="return confirm('Xóa suất chiếu này?')">
                        <button type="submit" class="btn btn-danger" style="padding:4px 10px;font-size:0.85rem;">Xóa</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(showtimes)}">
                <td colspan="7" style="text-align:center;color:#aaa;">Chưa có suất chiếu nào</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
