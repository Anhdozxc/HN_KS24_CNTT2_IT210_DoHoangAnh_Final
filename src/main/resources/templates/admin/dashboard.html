<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Dashboard - Admin</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>

<!-- Nhúc navbar từ fragment -->
<div th:replace="~{fragments/layout :: navbar}"></div>

<div class="container">
    <h1 style="margin-bottom:24px;">Trang quản trị</h1>

    <!-- 4 ô thống kê -->
    <div style="display:flex; gap:20px; margin-bottom:30px;">
        <div style="background:#fff;padding:20px;border-radius:8px;flex:1;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.08);">
            <div style="font-size:2rem;font-weight:bold;color:#0066cc;" th:text="${totalMovies}">0</div>
            <div>Tổng số phim</div>
        </div>
        <div style="background:#fff;padding:20px;border-radius:8px;flex:1;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.08);">
            <div style="font-size:2rem;font-weight:bold;color:#007700;" th:text="${totalUsers}">0</div>
            <div>Người dùng</div>
        </div>
        <div style="background:#fff;padding:20px;border-radius:8px;flex:1;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.08);">
            <div style="font-size:2rem;font-weight:bold;color:#e94560;" th:text="${totalBookings}">0</div>
            <div>Tổng đơn đặt vé</div>
        </div>
        <div style="background:#fff;padding:20px;border-radius:8px;flex:1;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.08);">
            <div style="font-size:1.4rem;font-weight:bold;color:#8a2be2;"
                 th:text="${#numbers.formatDecimal(totalRevenue, 0, 'COMMA', 0, 'POINT') + ' VND'}">0 VND</div>
            <div>Doanh thu đã xác nhận</div>
        </div>
    </div>

    <div class="table-wrap" style="margin-bottom:24px;">
        <h2 style="margin-bottom:16px;">Top 5 phim doanh thu cao nhất</h2>
        <table>
            <thead>
            <tr>
                <th>Phim</th>
                <th>Số đơn xác nhận</th>
                <th>Doanh thu</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="movie : ${topMovies}">
                <td th:text="${movie.movieTitle}"></td>
                <td th:text="${movie.confirmedBookings}"></td>
                <td th:text="${#numbers.formatDecimal(movie.revenue, 0, 'COMMA', 0, 'POINT') + ' VND'}"></td>
            </tr>
            <tr th:if="${#lists.isEmpty(topMovies)}">
                <td colspan="3" style="text-align:center;color:#999;">Chưa có dữ liệu doanh thu.</td>
            </tr>
            </tbody>
        </table>
    </div>

    <div style="display:flex;gap:12px;">
        <a href="/admin/movies" class="btn btn-primary">Quản lý phim</a>
        <a href="/admin/showtimes" class="btn btn-secondary">Quản lý suất chiếu</a>
    </div>
</div>

<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
