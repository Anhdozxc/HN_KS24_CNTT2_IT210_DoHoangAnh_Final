<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <!-- th:text de dat tieu de dong theo trang -->
    <title th:text="${pageTitle != null ? pageTitle + ' - Cinema' : 'Cinema Booking'}">Cinema</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>

<!-- THANH ĐIỀU HƯỚNG (dùng th:fragment để nhúc vào trang khác) -->
<nav th:fragment="navbar">
    <div class="navbar">
        <a href="/" class="logo">CinemaBooking</a>

        <div class="nav-links">
            <!-- Hiển link theo quyền -->
            <a href="/" >Trang chủ</a>

            <!-- Nếu đăng nhập -->
            <div th:if="${session.loggedUser != null}">

                <!-- Admin -->
                <span th:if="${session.loggedUser.role.name() == 'ADMIN'}">
                    <a href="/admin/dashboard">Dashboard</a>
                    <a href="/admin/movies">Quản lý phim</a>
                    <a href="/admin/showtimes">Suất chiếu</a>
                </span>

                <!-- Staff -->
                <span th:if="${session.loggedUser.role.name() == 'STAFF'}">
                    <a href="/staff/orders">Tra cứu vé</a>
                </span>

                <!-- Customer -->
                <span th:if="${session.loggedUser.role.name() == 'CUSTOMER'}">
                    <a href="/booking/history">Lịch sử đặt vé</a>
                </span>

                <a href="/profile/edit">Hồ sơ</a>

                <!-- Hiển tên user -->
                <span class="username" th:text="'Xin chào, ' + ${session.loggedUser.username}"></span>
                <a href="/auth/logout" class="btn-logout">Đăng xuất</a>
            </div>

            <!-- Chưa đăng nhập -->
            <div th:if="${session.loggedUser == null}">
                <a href="/auth/login">Đăng nhập</a>
                <a href="/auth/register">Đăng ký</a>
            </div>
        </div>
    </div>
</nav>

<!-- FOOTER -->
<footer th:fragment="footer">
    <div class="footer">
        <p>Cinema Booking System - Java Web Application</p>
    </div>
</footer>

</body>
</html>
